schema: spec-driven

context: |
  Tech stack: Python (pandas, Playwright, pymongo, python-dotenv, tqdm).
  Architecture: WhoScored LaLiga scraper; writes local CSV/Parquet under data/whoscored_laliga (MongoDB Atlas optional, free tier limited).
  Goal: Predictive model for total throw-ins per match, split by home/away team (regression/count target).
  Main dataset: throw_ins (event-level) + team_stats (match-level aggregates). Supporting: pass_map, heatmap, all_events.
  Reference data: data/reference/stadiums.csv — pitch dimensions + capacity per stadium, keyed by whoscored_id → team_id.
  Reference data: data/reference/weather.parquet — meteorología en hora de kickoff por match_id (Open-Meteo, sin API key).
  Modeling: model/ (dataset_builder.py, features.py, train.py, predict.py) + notebooks/01_eda.ipynb; artefactos en data/model/ (dataset.parquet, model_v1.joblib, metrics_v1.json, feature_importance.csv, predictions_*.parquet).
  Testing: Ad hoc scripts (test_single.py, validate.py); no packaged test runner.
  Style: No repo-root formatter/linter config detected.

rules:
  proposal:
    - Include rollback plan for risky changes
    - Identify affected modules/packages
  specs:
    - Use Given/When/Then format for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group tasks by phase (infrastructure, implementation, testing)
    - Use hierarchical numbering (1.1, 1.2, etc.)
    - Keep tasks small enough to complete in one session
  apply:
    - Follow existing code patterns and conventions
    - Load relevant coding skills for the project stack
    tdd: false
    test_command: ""
  verify:
    - Run tests if test infrastructure exists
    - Compare implementation against every spec scenario
    test_command: ""
    build_command: ""
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas (large removals)
